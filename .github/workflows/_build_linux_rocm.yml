# #########################################################
# Build ROCm wheels with self-hosted runner (no container)
# #########################################################
# Prerequisites (must be pre-installed on the runner):
#   - sudo access
#   - Basic tools: curl, wget, git
#
# All other dependencies (Python, ROCm) are installed during
# the workflow and cleaned up afterwards.
#
# This workflow measures build time and disk usage so a single
# ROCm cell can be evaluated before wheels are distributed, and keeps
# the wheel as a job artifact so it can be tested on a real AMD GPU
# (the cleanup step below deletes the build tree either way).
# #########################################################

name: "[Linux, ROCm, self-hosted, no container] Build wheels"

on:
  workflow_call:
    inputs:
      flash-attn-version:
        description: "Flash-Attention version"
        required: true
        type: string
      python-version:
        description: "Python version"
        required: true
        type: string
      torch-version:
        description: "PyTorch version"
        required: true
        type: string
      rocm-version:
        description: "ROCm version"
        required: true
        type: string
      rocm-install-method:
        description: "ROCm install method (auto, package-manager, runfile, pip)"
        required: false
        type: string
        default: "auto"
      gpu-archs:
        description: "Semicolon-separated GPU targets bundled into the wheel (empty: build_linux_rocm.sh default)"
        required: false
        type: string
        default: ""
      runner:
        description: "Runner type"
        required: false
        type: string
        default: '["self-hosted", "Linux", "x64"]'
      build-timeout-minutes:
        description: "Minutes from job start until the build is capped so the job can still finish before its GITHUB_TOKEN expires"
        required: false
        type: number
        default: 1200
      is-upload:
        description: "Whether to upload the release asset"
        required: false
        type: boolean
        default: true

jobs:
  build_wheels_rocm:
    name: Build wheels (Linux, ROCm, self-hosted, no container)
    runs-on: ${{ fromjson(inputs.runner) }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm-256color
    timeout-minutes: 2160

    steps:
      # A job's GITHUB_TOKEN expires 24h after the job starts, so a build that
      # runs longer succeeds and then fails to upload its release asset. The
      # cap below is measured from here rather than from the build so that
      # ROCm setup and torch download count toward it.
      - name: Record job start time
        run: echo "BUILD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check environment
        run: |
          cat /etc/os-release || true
          echo "-----------------------------"
          lscpu || true
          echo "-----------------------------"
          free -h || true

      - uses: actions/checkout@v6

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory $(pwd)

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Python
        run: |
          uv venv -p ${{ inputs.python-version }} --python-preference only-managed
          uv pip install -U pip setuptools==75.8.0 wheel packaging psutil auditwheel
          current_dir=$(pwd)
          echo "$current_dir/.venv/bin" >> $GITHUB_PATH

      - name: Setup ROCm
        id: setup_rocm
        uses: mjun0812/setup-rocm@v1
        with:
          version: ${{ inputs.rocm-version }}
          method: ${{ inputs.rocm-install-method }}

      # Without ccache the build still runs, just without resume, so a
      # package-manager hiccup must not fail the job.
      - name: Install ccache
        continue-on-error: true
        run: |
          if ! command -v ccache > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          ccache --version | head -n 1

      # The compile cache is carried between attempts through actions/cache
      # rather than left on the runner's disk, because the two self-hosted
      # runners share one label and a re-run lands on either of them. Keeping
      # it off the disk is also why cleanup can delete it like the pip and uv
      # caches: nothing here has to survive the job.
      #
      # The key ties the cache to this exact cell and workflow run, so a
      # re-run restores only what an earlier attempt of the same run saved.
      # Each attempt saves under its own immutable key; the restore prefix
      # drops the attempt suffix.
      - name: Compute ccache key
        id: cache_meta
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-rocm" >> "$GITHUB_ENV"
          fingerprint=$({
            hipcc --version
            cat build_linux_rocm.sh
            echo "${{ inputs.gpu-archs }}"
          } | sha256sum | cut -c1-16)
          # A fa2:/fa3: version carries a colon, which has no business in a key.
          fa=$(echo "${{ inputs.flash-attn-version }}" | tr ':' '-')
          base="fa-rocm-ccache-fa${fa}-py${{ inputs.python-version }}-torch${{ inputs.torch-version }}-rocm${{ inputs.rocm-version }}-${fingerprint}-${{ github.run_id }}"
          echo "key=${base}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "restore-prefix=${base}-" >> "$GITHUB_OUTPUT"
          echo "Cache key: ${base}-${{ github.run_attempt }}"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache_meta.outputs.key }}
          restore-keys: |
            ${{ steps.cache_meta.outputs.restore-prefix }}

      - name: Measure before build
        if: always()
        run: |
          echo "ROCm version: ${{ steps.setup_rocm.outputs.version }}"
          echo "ROCm path: ${{ steps.setup_rocm.outputs.rocm-path }}"
          echo "-----------------------------"
          du -sh "${{ steps.setup_rocm.outputs.rocm-path }}" || true
          echo "-----------------------------"
          df -h || true

      - name: Record build start time
        run: |
          echo "BUILD_STARTED_AT=$(date +%s)" >> $GITHUB_ENV

      # build_linux_rocm.sh prints the resolved MAX_JOBS and GPU_ARCHS; an empty
      # GPU_ARCHS falls back to the script's default
      - name: Build wheels
        id: build
        env:
          GPU_ARCHS: ${{ inputs.gpu-archs }}
          BUILD_TIMEOUT_MINUTES: ${{ inputs.build-timeout-minutes }}
        run: |
          chmod +x build_linux_rocm.sh
          deadline=$((BUILD_JOB_STARTED_AT + BUILD_TIMEOUT_MINUTES * 60))
          remaining=$((deadline - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            echo "::error::Setup already used the whole ${BUILD_TIMEOUT_MINUTES}m budget; nothing left to build in."
            exit 1
          fi
          echo "Build deadline in ${remaining}s (${BUILD_TIMEOUT_MINUTES}m from job start)"
          rc=0
          timeout --signal=TERM "${remaining}s" \
            ./build_linux_rocm.sh ${{ inputs.flash-attn-version }} ${{ inputs.python-version }} ${{ inputs.torch-version }} ${{ inputs.rocm-version }} || rc=$?
          if [ "$rc" = "124" ]; then
            # Only a capped build is worth carrying over: a finished one has
            # nothing left to resume, and a compile error would be repeated.
            echo "capped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Build hit the ${BUILD_TIMEOUT_MINUTES}m cap. Every object compiled so far is in ccache, so re-running this job resumes from there instead of starting over."
          fi
          exit "$rc"

      - name: Save ccache (only when capped)
        if: ${{ always() && steps.build.outputs.capped == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache_meta.outputs.key }}

      - name: Report build duration
        if: always() && env.BUILD_STARTED_AT
        run: |
          echo "Build wall clock: $(($(date +%s) - BUILD_STARTED_AT)) seconds"

      - name: Locate wheel
        id: build_wheels
        run: |
          wheel_path=$(ls flash-attention/dist/*.whl | head -n 1)
          echo "WHEEL_PATH=$wheel_path" >> $GITHUB_OUTPUT
          # Name the artifact after the wheel: a fa2:/fa3: version would put a
          # colon in the name, which the artifact service rejects.
          wheel_name=$(basename "$wheel_path" .whl)
          echo "ARTIFACT_NAME=rocm-wheel-${wheel_name}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Measure after build
        if: always()
        run: |
          ccache --show-stats 2>/dev/null || true
          echo "-----------------------------"
          du -sh flash-attention || true
          echo "-----------------------------"
          ls -l "${{ steps.build_wheels.outputs.WHEEL_PATH }}" || true
          echo "-----------------------------"
          df -h || true

      - name: Show wheel dependencies
        continue-on-error: true
        run: |
          auditwheel show ${{ steps.build_wheels.outputs.WHEEL_PATH }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_wheels.outputs.ARTIFACT_NAME }}
          path: ${{ steps.build_wheels.outputs.WHEEL_PATH }}
          if-no-files-found: ignore

      - name: Install Test
        run: |
          pip uninstall -y flash-attn > /dev/null 2>&1
          pip install --no-cache-dir ${{ steps.build_wheels.outputs.WHEEL_PATH }}
          python -c "import flash_attn; from importlib.metadata import version; print(version('flash-attn'))"

      - name: Upload Release Asset
        if: ${{ inputs.is-upload }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name=${{ github.ref_name }}
          wheel_path="${{ steps.build_wheels.outputs.WHEEL_PATH }}"
          # Check if the file exists
          if [ ! -f "$wheel_path" ]; then
            echo "Error: Wheel file not found at $wheel_path"
            exit 1
          fi
          # Upload the release asset using GitHub CLI
          gh release upload "$tag_name" "$wheel_path" --clobber

      # Cleanup step - always runs even if previous steps fail
      - name: Cleanup (always run)
        if: always()
        run: |
          echo "=========================================="
          echo "Starting cleanup for self-hosted runner..."
          echo "=========================================="

          # 1. Remove flash-attention directory (source and build artifacts)
          FLASH_ATTN_DIR="$(pwd)/flash-attention"
          if [ -d "$FLASH_ATTN_DIR" ]; then
            echo "[1/6] Removing flash-attention directory: $FLASH_ATTN_DIR"
            rm -rf "$FLASH_ATTN_DIR" || true
          else
            echo "[1/6] flash-attention directory not found, skipping"
          fi

          # 2. Remove Python virtual environment (.venv)
          VENV_DIR="$(pwd)/.venv"
          if [ -d "$VENV_DIR" ]; then
            echo "[2/6] Removing Python virtual environment: $VENV_DIR"
            rm -rf "$VENV_DIR" || true
          else
            echo "[2/6] .venv directory not found, skipping"
          fi

          # 3. Remove pip cache
          PIP_CACHE_DIR="$HOME/.cache/pip"
          if [ -d "$PIP_CACHE_DIR" ]; then
            echo "[3/6] Removing pip cache: $PIP_CACHE_DIR"
            rm -rf "$PIP_CACHE_DIR" || true
          else
            echo "[3/6] pip cache not found, skipping"
          fi

          # 4. Remove uv cache
          UV_CACHE_DIR="$HOME/.cache/uv"
          if [ -d "$UV_CACHE_DIR" ]; then
            echo "[4/6] Removing uv cache: $UV_CACHE_DIR"
            rm -rf "$UV_CACHE_DIR" || true
          else
            echo "[4/6] uv cache not found, skipping"
          fi

          # 5. Uninstall ROCm
          echo "[5/6] Removing ROCm installation..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get remove -y --purge 'rocm*' 'hip*' 'hsa-*' 2>/dev/null || true
            sudo apt-get autoremove -y 2>/dev/null || true
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf remove -y 'rocm*' 'hip*' 'hsa-*' 2>/dev/null || true
          fi
          ROCM_INSTALL_DIR="${{ steps.setup_rocm.outputs.rocm-path }}"
          if [ -n "$ROCM_INSTALL_DIR" ] && [ -d "$ROCM_INSTALL_DIR" ]; then
            sudo rm -rf "$ROCM_INSTALL_DIR" || true
          fi
          sudo rm -rf /opt/rocm* || true

          # The compile cache lives in actions/cache, so the copy on this
          # runner is disposable and goes the way of the pip and uv caches.
          if [ -n "${CCACHE_DIR:-}" ] && [ -d "$CCACHE_DIR" ]; then
            echo "[6/6] Removing ccache directory: $CCACHE_DIR"
            du -sh "$CCACHE_DIR" 2>/dev/null || true
            rm -rf "$CCACHE_DIR" || true
          else
            echo "[6/6] ccache directory not found, skipping"
          fi

          echo "=========================================="
          echo "Cleanup completed."
          echo "=========================================="
